name: ci

# Thin caller. The pipeline itself — Pint, Pest, a blocking composer audit, and
# the reasoning for why nothing here deploys — lives once in the reusable
# workflow below, so a fleet-wide CI change is one commit there instead of the
# same edit in seven repos. The standard: jims_dev_way/playbooks/deployment.md.

on:
  push:
  workflow_dispatch:
  schedule:
    # Weekly, so composer audit still runs on a repo nobody has pushed to: a new
    # advisory against a quiet repo is invisible to push-only CI. The fleet's
    # crons are staggered five minutes apart rather than firing at once; this
    # repo owns Monday 11:05 UTC. Scheduled runs only ever use the default branch.
    - cron: '5 11 * * 1'

permissions:
  contents: read

jobs:
  ci:
    uses: wrightster/.github/.github/workflows/laravel-ci.yml@main
    with:
      # A library, not an app: testbench, composer scripts, no lock file.
      package-mode: true
